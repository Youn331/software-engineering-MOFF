name: MOFF verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ephemeral
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ephemeral@localhost:5432/postgres
      SESSION_SECRET: ephemeral-ci-session
      PAYMENT_MODE: demo
      SEED_DEMO_CATALOG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build && npm run db:migrate && npm test
      - run: |
          npm start > /tmp/moff-ci.log 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 -fsS http://localhost:3001/health
          node --import tsx server/flow-smoke.ts
